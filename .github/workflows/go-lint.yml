name: Linters and Tests

on:
  pull_request:
    branches:
      - master

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The jobs deliberately fan out instead of chaining `make` / `make test` /
# `make test-race` inside one runner: they are independent gates, and the
# old serial layout also ran the `verifiers` prerequisite twice (once per
# make invocation). `make test`/`make test-race` no longer depend on
# `verifiers`, so each job below pays for exactly one gate. The
# docs/debugging submodules gate lives in go.yml to avoid a second run.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          check-latest: true
          cache: true
      - name: Build
        env:
          CGO_ENABLED: 0
          GO111MODULE: on
        run: make build

  verifiers:
    name: Lint and codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          check-latest: true
          cache: true
      # Key must stay in sync with GOLANGCI_VERSION in the Makefile.
      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: .bin/golangci
          key: golangci-v2.14.0
      - name: Lint and codegen drift
        run: |
          sudo sysctl net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl net.ipv6.conf.default.disable_ipv6=0
          make lint check-gen

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          check-latest: true
          cache: true
      - name: Unit tests
        env:
          CGO_ENABLED: 0
          GO111MODULE: on
        run: |
          sudo sysctl net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl net.ipv6.conf.default.disable_ipv6=0
          make test TEST_FLAGS=-count=1

  test-race:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          check-latest: true
          cache: true
      - name: Unit tests under -race
        run: |
          sudo sysctl net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl net.ipv6.conf.default.disable_ipv6=0
          make test-race

  no-new-globals:
    name: Guard - no new global* vars in cmd/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on purpose: the three-dot diff below needs a real
          # merge-base, and shallow grafts break it. This job runs parallel
          # to the test jobs, so the bigger clone is off the critical path.
          fetch-depth: 0
      - name: Check additions
        run: |
          git fetch origin master --depth=1
          if git diff -U0 origin/master...HEAD -- cmd/ | grep -E '^\+\s*(var\s+)?global[A-Z]'; then
            echo "::error::Adding package-level global* variables in cmd/ is not allowed - see CONTRIBUTING.md and docs/fork/backlog.md"
            exit 1
          fi
