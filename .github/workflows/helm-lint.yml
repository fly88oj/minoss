name: Helm Chart linting

on:
  pull_request:
    branches:
      - master

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run helm lint
        run: |
          cd helm/minio
          helm lint .
          # Default values create no monitoring objects at all, so linting them
          # proves nothing about the scrape config. Render it and assert the
          # removed metrics v2 endpoints can never come back.
          helm lint . --set metrics.serviceMonitor.enabled=true \
            --set metrics.serviceMonitor.includeNode=true \
            --set metrics.serviceMonitor.public=false \
            --set metrics.serviceMonitor.bearerTokenSecret=ci-token \
            --set tls.enabled=true --set tls.certSecret=ci-tls
          rendered=$(helm template ci . \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.serviceMonitor.includeNode=true)
          echo "$rendered" | grep -q 'monitoring.coreos.com/v1'
          if echo "$rendered" | grep -q '/minio/v2/metrics'; then
            echo "metrics v2 scrape paths are gone from this build; use /minio/metrics/v3/<collector>"
            exit 1
          fi
          # Every scrape pool needs its own target identity, or all of a release's
          # pools write the same `up` series and one dead collector makes scraping
          # look intermittently healthy. Assert one `collector` label per endpoint
          # and per Probe, whatever the path lists are.
          sm=$(echo "$rendered" | sed -n '/^kind: ServiceMonitor$/,/^---$/p')
          probes=$(echo "$rendered" | sed -n '/^kind: Probe$/,$p')
          endpoints=$(echo "$sm" | grep -c '^      path: /minio/metrics/v3')
          node_ids=$(echo "$sm" | grep -c 'targetLabel: collector')
          probe_count=$(echo "$probes" | grep -c '^kind: Probe')
          probe_ids=$(echo "$probes" | grep -c '^        collector: ')
          if [ "$endpoints" != "$node_ids" ] || [ "$probe_count" != "$probe_ids" ] || [ "$endpoints" = 0 ]; then
            echo "expected one collector label per scrape ($endpoints endpoints/$node_ids labels, $probe_count probes/$probe_ids labels)"
            exit 1
          fi
          echo "monitoring scrape: $endpoints per-pod collectors, $probe_count cluster collectors, all identified"
